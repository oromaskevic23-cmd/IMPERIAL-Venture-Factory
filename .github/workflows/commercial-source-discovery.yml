name: Commercial source discovery — public read-only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/commercial-source-discovery.yml'
      - 'commercial_pilot/source_sync.py'
      - 'commercial_pilot/triage.py'
  schedule:
    - cron: '11 * * * *'

permissions:
  contents: read

concurrency:
  group: commercial-source-discovery
  cancel-in-progress: false

jobs:
  discover-public-enquiries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Enforce offline source safety tests
        run: python -m unittest discover -s commercial_pilot -p 'test_*.py' -v
      - name: Discover public GitHub requests without credentials or customer content in logs
        run: python -m commercial_pilot.source_sync --max-issues 30
