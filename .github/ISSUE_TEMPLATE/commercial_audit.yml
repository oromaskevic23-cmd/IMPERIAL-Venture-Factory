name: "Automation Failure Audit — request an estimate"
description: "Public, non-binding request for IC-OFFER-001. Do not post credentials, personal data or proprietary files."
title: "[Audit request] "
body:
  - type: markdown
    attributes:
      value: |
        **IMPERIAL Core — scoped automation failure audit (pilot).**
        This is a PUBLIC GitHub issue. Never disclose API keys, passwords, emails, customer datasets or confidential configuration.
        Requests are reviewed; no contract, price, autonomous production changes or delivery is established by this form.
        Indicative range USD 49–149, subject to written scope and owner approval. No upfront payment is requested here.
  - type: dropdown
    id: type
    attributes:
      label: What should be assessed?
      options:
        - One webhook or API integration
        - One CRM / workflow automation
        - Uncertain — need scoping
    validations:
      required: true
  - type: textarea
    id: symptoms
    attributes:
      label: Public, non-confidential description of the problem
      description: "Describe symptoms, not credentials, URLs with tokens, customer data or confidential logs."
      placeholder: "We see occasional duplicate requests and HTTP 429 responses..."
    validations:
      required: true
  - type: dropdown
    id: desired
    attributes:
      label: Expected first deliverable
      options:
        - Diagnostic report and reproducible synthetic test
        - Audit plus implementation quote
        - Scope discussion first
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Public issue privacy and scope confirmation
      options:
        - label: "I understand this issue is public and contains no secrets, personal data, payment details, or confidential material."
          required: true
        - label: "I understand any price, delivery and live system access require separate human agreement and explicit approval."
          required: true
